[package]
name = "bq_macros"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Procedural macros for boutique: #[component], attrs! and setup!"

[lib]
proc-macro = true

[dependencies]
bq_html = { version = "0.2.0", path = "../html" }
heck = "0.5"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
