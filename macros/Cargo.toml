[package]
name = "bq_macros"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
description = "Procedural macros for boutique: #[component], #[ts], attrs! and html!"

[lib]
proc-macro = true

[dependencies]
bq_html.workspace = true

proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
