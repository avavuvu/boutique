[package]
name = "boutique"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
description = "A framework for integrating server-side rendered Rust apps with JavaScript"

[features]
default = ["ui"]
ui = ["bq_components/ui"]
devtools = ["dep:dioxus-devtools"]
cloudinary = ["dep:reqwest", "dep:sha1", "dep:url"]
sea-orm = ["dep:sea-orm"]

[dependencies]
bq_components.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
axum-extra = { version = "0.10", features = ["cookie"] }
sea-orm = { version = "1", optional = true, default-features = false, features = ["with-chrono"] }

dioxus-devtools = { version = "0.7.3", optional = true, features = ["serve"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
chrono = "0.4"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
maud = { version = "0.27", features = ["axum"] }
validator = { version = "0.20", features = ["derive"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "multipart", "json"] }
sha1 = { version = "0.10", optional = true }
url = { version = "2", optional = true }

[build-dependencies]
sha2 = "0.10"
